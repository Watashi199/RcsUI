# Mises à jour des dépendances (PLAN.md §8, n° 16 ; docs/roadmap.md, M8).
# Dependabot plutôt que Renovate : intégré à GitHub, aucune application à installer.
# cooldown : on laisse 14 jours à une version avant de l'adopter (retraits, compromissions).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "build(go)"

  - package-ecosystem: npm
    directories: [/web, /e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Les types suivent le runtime (Node 24 LTS en CI et dans l'image).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 : refusé par les peer deps de l'outillage Svelte/ESLint (ERESOLVE, 2026-11).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(npm)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # codacy-analysis-cli-action v4 produit plusieurs runs SARIF par catégorie,
      # refusés par upload-sarif : à adapter dans codacy.yml avant de monter.
      - dependency-name: codacy/codacy-analysis-cli-action
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Node : uniquement les versions LTS (paires), montées à la main avec la CI.
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(docker)"
