name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install rsync (engine integration tests)
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet -tags noweb ./...
      - name: Test (race)
        # internal/engine/rclone est exclu de -race : data race connue dans rclone v1.76.0
        # (fs/accounting/stats.go RemoteStats lit errors/lastError hors verrou). Voir docs/spikes.md.
        # La couverture par package (objectif ≥ 80 %, PLAN.md §9) est reportée dans le résumé du run.
        run: |
          set -o pipefail
          go test -tags noweb -race -count=1 -cover $(go list -tags noweb ./... | grep -v /internal/engine/rclone) | tee test.out
          go test -tags noweb -count=1 -cover ./internal/engine/rclone/ | tee -a test.out
          {
            echo '| Package | Couverture |'
            echo '|---|---|'
            sed -nE 's/^ok[[:space:]]+([^[:space:]]+).*coverage: ([0-9.]+%).*/| `\1` | \2 |/p' test.out
          } >> "$GITHUB_STEP_SUMMARY"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags noweb ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rcsui:e2e
          build-args: VERSION=e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run e2e
        run: bash e2e/run.sh rcsui:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/server.log
          retention-days: 7

  docker:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: rcsui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        run: |
          docker buildx build --load -t rcsui:smoke .
          docker run --rm --entrypoint rsync rcsui:smoke --version | head -1
          docker run -d --name rcsui -p 8080:8080 -e RCSUI_ADMIN_PASSWORD=ci-admin-password rcsui:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/v1/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker logs rcsui

  # Publication d'une release (tag v*) : uniquement si tous les tests sont verts.
  # Image multi-arch sur GHCR, SBOM et provenance SLSA attachés par buildx,
  # signature cosign « keyless » (OIDC GitHub Actions, sans clé à gérer) et
  # attestation de provenance GitHub. Vérification : voir docs/release.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write # création de la release GitHub
      packages: write # push sur ghcr.io
      id-token: write # OIDC pour cosign keyless et l'attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name (GHCR exige des minuscules)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: latest=auto
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      # Dépôt privé : l'attestation GitHub exige un plan Enterprise, et la
      # signature keyless publierait le nom du dépôt dans le journal public
      # Rekor. Les deux ne sont faites que pour un dépôt public.
      - name: Signing skipped (private repository)
        if: github.event.repository.private
        run: echo "::warning::Private repository - image not signed and no provenance attestation. Make the repository public before the v1.0 release."
      - uses: sigstore/cosign-installer@v3
        if: ${{ !github.event.repository.private }}
      - name: Sign image (cosign keyless)
        if: ${{ !github.event.repository.private }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.img.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Provenance attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${TAG#v}"
            echo "# digest : ${DIGEST}"
            echo '```'
            echo
            echo "Vérifier la signature : voir [docs/release.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/release.md)."
          } > notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes --verify-tag $prerelease
