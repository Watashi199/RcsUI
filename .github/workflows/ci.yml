name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install rsync (engine integration tests)
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client
      - name: Vet
        run: go vet -tags noweb ./...
      - name: Test (race)
        # internal/engine/rclone est exclu de -race : data race connue dans rclone v1.76.0
        # (fs/accounting/stats.go RemoteStats lit errors/lastError hors verrou). Voir docs/spikes.md.
        run: |
          go test -tags noweb -race -count=1 $(go list -tags noweb ./... | grep -v /internal/engine/rclone)
          go test -tags noweb -count=1 ./internal/engine/rclone/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags noweb ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm run check
      - run: npm test
      - run: npm run build

  docker:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: rcsui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        run: |
          docker buildx build --load -t rcsui:smoke .
          docker run --rm --entrypoint rsync rcsui:smoke --version | head -1
          docker run -d --name rcsui -p 8080:8080 -e RCSUI_ADMIN_PASSWORD=ci-admin-password rcsui:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/v1/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker logs rcsui
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
